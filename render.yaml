services:
  - type: web
    name: linsiq-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linsiq-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: CORS_ORIGINS
        value: "*"
      - key: REDIS_URL
        value: "memory://"
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: CELERY_RESULT_BACKEND
        value: "memory://"
    healthCheckPath: /health

databases:
  - name: linsiq-db
    plan: free
