app = 'linsiq'
primary_region = 'jnb'

[build]
  dockerfile = 'backend/Dockerfile'

[env]
  PORT = '8000'
  AWS_DEFAULT_REGION = 'us-east-1'
  CORS_ORIGINS = 'https://linsiq.surge.sh,http://localhost:5173'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 3

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[vm]
  size = 'shared-cpu-1x'
  memory = '256mb'
